<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>On chante quoi ?</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Les enregistrements de Seb, voix par voix : Soprane, Alto, Hommes, Tous.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f3f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16121a" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="On chante quoi ?">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <style>
    .too-old { font: 17px/1.45 -apple-system, system-ui, sans-serif; max-width: 30em; margin: 0 auto; padding: 48px 20px; }
    .too-old h1 { font-size: 22px; margin: 0 0 12px; }
  </style>
  <script>
    // Téléphone trop ancien : un message au lieu d'un écran blanc.
    // Script classique (pas un module) : il s'exécute même quand le navigateur ne comprend pas l'app.
    (function () {
      var shown = false;
      function started() {
        var root = document.querySelector('app-root');
        return !!(root && root.children.length);
      }
      function show() {
        if (shown || started() || !document.body) return;
        shown = true;
        var ua = navigator.userAgent;
        var ios = /iPhone|iPad|iPod/.test(ua);
        var v = /OS (\d+)_(\d+)/.exec(ua);
        var box = document.createElement('div');
        box.className = 'too-old';
        box.setAttribute('role', 'alert');
        box.innerHTML = ios
          ? '<h1>iPhone trop ancien</h1><p>L’app de la chorale demande iOS 15 ou plus récent' +
            (v ? ' (cet iPhone : iOS ' + v[1] + '.' + v[2] + ')' : '') +
            '.</p><p>Mettez l’iPhone à jour : Réglages › Général › Mise à jour logicielle. Sinon, ouvrez le lien sur un autre téléphone ou un ordinateur.</p>'
          : '<h1>Navigateur trop ancien</h1><p>L’app de la chorale ne fonctionne pas avec ce navigateur. Mettez-le à jour, ou ouvrez le lien avec un autre navigateur (Chrome, Safari, Firefox).</p>';
        document.body.insertBefore(box, document.body.firstChild);
      }
      // Syntaxe récente utilisée par l'app (iOS 15 et plus)
      try {
        new Function('class A { #p() {} static t(o) { return #p in o; } } return (null)?.x ?? 1;');
      } catch (e) {
        document.addEventListener('DOMContentLoaded', show);
      }
      // L'app plante avant d'avoir affiché quoi que ce soit (fonction manquante, fichier illisible)
      window.addEventListener('error', function () {
        setTimeout(show, 0);
      });
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Activez JavaScript pour utiliser l'application de la chorale.</noscript>
</body>
</html>
