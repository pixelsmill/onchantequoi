<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a3e9d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chorale">
  <title>Chorale</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <h1 id="title">Chorale</h1>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="songs" aria-selected="true">Morceaux</button>
        <button role="tab" data-tab="inbox" aria-selected="false">À classer <span id="badge" class="badge" hidden>0</span></button>
      </nav>
    </header>

    <div id="demo" class="demo" hidden>Mode démo : données fictives, rien n'est enregistré.</div>

    <main>
      <section id="view-songs">
        <input id="search" class="search" type="search" placeholder="Rechercher un morceau" hidden>
        <ul id="songs" class="songs"></ul>
      </section>
      <section id="view-inbox" hidden>
        <ul id="inbox" class="inbox"></ul>
      </section>
    </main>

    <label class="fab" id="fab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
      <span>Déposer</span>
      <input id="file" type="file" accept="audio/*,video/mp4,.mp4,.opus,.ogg,.m4a,.mp3,.aac,.wav" multiple hidden>
    </label>

    <div id="player" class="player" hidden>
      <div class="player-row">
        <button id="p-play" class="p-play" aria-label="Lecture"></button>
        <div class="p-info">
          <div id="p-title" class="p-title"></div>
          <div class="p-sub"><span id="p-voice"></span> · <span id="p-time">0:00</span></div>
        </div>
        <button id="p-close" class="icon-btn" aria-label="Fermer">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <input id="p-seek" class="p-seek" type="range" min="0" max="1000" value="0" aria-label="Position">
      <div class="player-row small">
        <button id="p-back" class="chip-btn">−10 s</button>
        <button id="p-speed" class="chip-btn">Vitesse 1×</button>
        <button id="p-loop" class="chip-btn" aria-pressed="false">Boucle</button>
        <button id="p-wrong" class="link-btn">Mal classé ?</button>
      </div>
    </div>

    <div id="sheet-wrap" class="sheet-wrap" hidden>
      <div class="sheet" id="sheet"></div>
    </div>
    <div id="toast" class="toast" hidden></div>
  </div>

  <div id="gate" class="gate" hidden>
    <div class="gate-box">
      <h2>Bienvenue</h2>
      <p id="gate-msg">Ouvrez le lien de la chorale reçu sur WhatsApp, ou collez-le ici :</p>
      <input id="gate-input" type="text" placeholder="Lien ou clé" autocomplete="off">
      <button id="gate-go" class="primary">Entrer</button>
    </div>
  </div>

  <audio id="audio" preload="none"></audio>
  <script type="module" src="/app.js"></script>
</body>
</html>
